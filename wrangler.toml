# Cloudflare Workers 配置
#
# ── 用「Deploy to Cloudflare」按钮部署时 ──
# 这个文件会被 Cloudflare 读取：它会**自动创建一个 KV 命名空间**并把真实 id 写回
# 你 fork 出来的仓库，不需要你手填。密钥则由 `.dev.vars.example` 声明，部署界面会逐条问你。
#
# ── 手动 wrangler 部署时 ──
#   npx wrangler kv namespace create STATE      # 建 KV，把返回的 id 填到下面
#   npx wrangler secret put TG_TOKEN
#   npx wrangler secret put TG_CHAT_ID
#   npx wrangler secret put TG_WEBHOOK_SECRET
#   npx wrangler secret put ADMIN_KEY
#   npx wrangler deploy

name = "tg-tf-monitor"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# 两个 Cron：
#   */30 * * * *  只监控（便宜、省事）
#   0 */6 * * *   监控 + 全源发现
# 第二条要和 src/config.js 里的 cron.discovery 一致 ——
# scheduled handler 靠比对 event.cron 决定跑哪个。
# 免费版每账户最多 5 条 Cron Trigger，这里用 2 条。
[triggers]
crons = ["*/30 * * * *", "0 */6 * * *"]

# 状态存储。部署按钮流程会自动创建并替换下面这个 id；
# 手动部署请换成 `wrangler kv namespace create STATE` 返回的真实 id。
[[kv_namespaces]]
binding = "STATE"
id = "00000000000000000000000000000000"

[observability]
enabled = true
